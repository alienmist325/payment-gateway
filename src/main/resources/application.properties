server.port=8090
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
spring.mvc.problemdetails.enabled=false
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.deserialization.accept-float-as-int=false
payments.bank.api-url=${PAYMENTS_BANK_API_URL:http://localhost:8080}
# Bounded so a bank that stops answering cannot hold gateway threads open indefinitely.
# The read timeout is the one a merchant feels, so it is kept well under a typical client timeout.
payments.bank.connect-timeout=${PAYMENTS_BANK_CONNECT_TIMEOUT:2s}
payments.bank.read-timeout=${PAYMENTS_BANK_READ_TIMEOUT:5s}
payments.currencies.supported-currencies=${PAYMENTS_SUPPORTED_CURRENCIES:GBP,USD,EUR}
spring.jackson.deserialization.fail-on-unknown-properties=true
